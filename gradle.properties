# JVM args for the Gradle daemon.
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8 -Djava.net.preferIPv4Stack=true

# Build performance
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# AndroidX
android.useAndroidX=true

# Transitive R classes: temporary XML/Views reference aggregated library attrs
# (colorOnBackground, backgroundColor). Compose rewrite (Phase 5) removes the need;
# flip back to true then.
android.nonTransitiveRClass=false

# Kotlin code style
kotlin.code.style=official
